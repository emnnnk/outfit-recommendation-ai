<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11192f"/>
      <stop offset="1" stop-color="#4facfe"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="url(#g)"/>
  <rect x="56" y="64" width="400" height="280" rx="28" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.16)"/>
  
  <!-- Modern Jean Pantolin Illustration -->
  <g transform="translate(256, 200)">
    <!-- Simplified jean shape -->
    <rect x="-60" y="-50" width="120" height="100" rx="8" fill="#4A5568" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <!-- Jean details -->
    <rect x="-50" y="-40" width="100" height="80" rx="6" fill="rgba(255,255,255,0.05)"/>
    <!-- Pocket lines -->
    <line x1="-45" y1="-30" x2="-25" y2="-30" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="25" y1="-30" x2="45" y2="-30" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <!-- Center seam -->
    <line x1="0" y1="-50" x2="0" y2="50" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <!-- Bottom hem -->
    <rect x="-60" y="45" width="120" height="5" fill="rgba(255,255,255,0.1)"/>
  </g>
  
  <g font-family="Inter,Segoe UI,Arial" fill="rgba(255,255,255,0.92)" text-anchor="middle">
    <text x="256" y="402" font-size="24" font-weight="800">Jean Pantolon</text>
    <text x="256" y="438" font-size="14" font-weight="600" fill="rgba(255,255,255,0.72)">bottom</text>
  </g>
</svg>
