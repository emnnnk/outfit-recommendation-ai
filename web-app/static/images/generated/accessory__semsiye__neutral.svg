<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11192f"/>
      <stop offset="1" stop-color="#4facfe"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="url(#g)"/>
  <rect x="56" y="64" width="400" height="280" rx="28" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.16)"/>
  
  <!-- Modern Umbrella Illustration -->
  <g transform="translate(256, 200)">
    <!-- Umbrella canopy - simplified arc -->
    <path d="M-70 -30 Q-70 -70 0 -70 Q70 -70 70 -30" 
          fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="3"/>
    <!-- Umbrella panels -->
    <path d="M-70 -30 Q-35 -60 0 -70 L0 -30 Z" 
          fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <path d="M0 -30 Q0 -60 35 -70 L70 -30 Z" 
          fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    
    <!-- Umbrella handle -->
    <rect x="-2" y="-30" width="4" height="60" rx="2" fill="#2D3748"/>
    <!-- Umbrella tip -->
    <circle cx="0" cy="35" r="4" fill="#2D3748"/>
    <!-- Simple ribs -->
    <line x1="0" y1="-30" x2="-50" y2="-60" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <line x1="0" y1="-30" x2="50" y2="-60" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>
  
  <g font-family="Inter,Segoe UI,Arial" fill="rgba(255,255,255,0.92)" text-anchor="middle">
    <text x="256" y="402" font-size="24" font-weight="800">Şemsiye</text>
    <text x="256" y="438" font-size="14" font-weight="600" fill="rgba(255,255,255,0.72)">accessory</text>
  </g>
</svg>
